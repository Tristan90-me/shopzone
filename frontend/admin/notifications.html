<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Baaba Hanson Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="mobile-overlay" id="mobileOverlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-text">Shop<span>Zone</span></div>
      <div class="sidebar-logo-badge">Admin</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Main</div>
      <a href="dashboard.html" class="nav-item">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="products.html" class="nav-item">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Products
      </a>
      <a href="orders.html" class="nav-item">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 12h6M9 16h4"/></svg>
        Orders
      </a>
      <a href="notifications.html" class="nav-item active">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Notifications
        <span class="nav-badge" id="msgBadge" style="display:none">0</span>
      </a>
      <div class="sidebar-section-label">Config</div>
      <a href="settings.html" class="nav-item">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="../index.html" class="sidebar-store-link" target="_blank">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        View Store
      </a>
      <button class="logout-btn" onclick="logout()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <button class="topbar-menu-btn" onclick="openSidebar()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title">Notifications</div>
      <div class="topbar-actions">
        <button class="btn btn-secondary btn-sm" onclick="loadMessages()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Refresh
        </button>
      </div>
    </div>

    <div class="page-content">

      <!-- Status filter tabs -->
      <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
        <button class="status-tab active" data-status="" onclick="setStatusFilter('', this)">
          All <span class="tab-count" id="count-all">0</span>
        </button>
        <button class="status-tab" data-status="new" onclick="setStatusFilter('new', this)">
          New <span class="tab-count" id="count-new">0</span>
        </button>
        <button class="status-tab" data-status="read" onclick="setStatusFilter('read', this)">
          Read <span class="tab-count" id="count-read">0</span>
        </button>
        <button class="status-tab" data-status="replied" onclick="setStatusFilter('replied', this)">
          Replied <span class="tab-count" id="count-replied">0</span>
        </button>
      </div>

      <!-- Search -->
      <div class="table-search" style="max-width:320px;margin-bottom:20px">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name or phone..." oninput="filterMessages()">
      </div>

      <!-- Messages list -->
      <div id="messagesList">
        <div class="empty-state"><div class="empty-state-icon">⏳</div><h3>Loading messages...</h3></div>
      </div>

    </div>
  </div>

  <!-- Message detail / reply modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal" style="max-width:560px">
      <div class="modal-header">
        <h3 id="modalCustomerName">Message</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Injected by JS -->
      </div>
    </div>
  </div>

  <!-- Delete confirm modal -->
  <div class="modal-overlay" id="deleteOverlay" onclick="handleDeleteOverlayClick(event)">
    <div class="modal" style="max-width:400px">
      <div class="modal-header">
        <h3>Delete Message</h3>
        <button class="modal-close" onclick="closeDeleteModal()">✕</button>
      </div>
      <div class="modal-body">
        <p style="color:var(--text-muted);font-size:14px;line-height:1.6">
          Are you sure you want to delete this message from <strong id="deleteCustomerName"></strong>?
          This action cannot be undone.
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete Message</button>
      </div>
    </div>
  </div>

  <style>
    .status-tab {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: var(--radius);
      font-size: 13px; font-weight: 500;
      border: 1.5px solid var(--border);
      background: var(--bg-card); color: var(--text-muted);
      cursor: pointer; transition: all var(--transition);
      font-family: var(--font-body);
    }
    .status-tab:hover { border-color: var(--border-strong); color: var(--text); }
    .status-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .tab-count {
      background: var(--bg-subtle); color: var(--text-muted);
      font-size: 11px; font-weight: 700;
      padding: 1px 7px; border-radius: 50px;
    }
    .status-tab.active .tab-count { background: rgba(255,255,255,0.2); color: white; }

    .msg-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }
    .msg-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
    .msg-card.unread { border-left: 3px solid var(--accent); }
    .msg-card-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; gap: 12px;
    }
    .msg-card-customer {
      display: flex; align-items: center; gap: 10px;
    }
    .msg-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg-subtle); color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      flex-shrink: 0;
    }
    .msg-card-name { font-weight: 600; font-size: 14px; color: var(--text); }
    .msg-card-phone { font-size: 12px; color: var(--text-muted); }
    .msg-card-date { font-size: 12px; color: var(--text-light); white-space: nowrap; }
    .msg-card-text {
      font-size: 13.5px; color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 10px;
    }
    .msg-card-footer {
      display: flex; align-items: center; justify-content: space-between;
    }
    .msg-card-order {
      font-size: 12px; color: var(--text-light);
    }
    .msg-card-actions { display: flex; gap: 6px; }

    .detail-row {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 16px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--text-muted); flex-shrink: 0; }
    .detail-val { font-weight: 600; color: var(--text); text-align: right; }
    .modal-section-title {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--text-light); margin: 20px 0 10px;
    }
    .modal-section-title:first-child { margin-top: 0; }

    .original-message-box {
      background: var(--bg-subtle);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.6;
    }
    .reply-bubble-admin {
      background: var(--accent-light);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .reply-bubble-admin-meta {
      font-size: 11px; color: var(--text-light);
      margin-top: 4px;
    }
    .reply-textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      font-family: var(--font-body);
      resize: vertical;
      min-height: 70px;
      color: var(--text);
    }
    .reply-textarea:focus { border-color: var(--accent); outline: none; }
    .reply-send-btn {
      margin-top: 10px;
      display: flex; align-items: center; gap: 8px;
    }
  </style>

  <script>
    const API ='https://api.baabahanson.com/api';;
    let allMessages = [];
    let activeStatus = '';
    let deleteTargetId = null;
    let activeMessageId = null;

    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
      };
    }
    function requireAuth() {
      if (!localStorage.getItem('adminToken')) window.location.href = 'login.html';
    }
    function logout() {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminUser');
      window.location.href = 'login.html';
    }
    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('mobileOverlay').classList.add('open');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('mobileOverlay').classList.remove('open');
    }
    function showToast(msg, type = 'success') {
      let container = document.querySelector('.toast-container');
      if (!container) {
        container = document.createElement('div');
        container.className = 'toast-container';
        document.body.appendChild(container);
      }
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
    function formatDate(d) {
      return new Date(d).toLocaleDateString('en-GB', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }
    function getInitials(name) {
      return name.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
    }
    function statusBadgeMsg(status) {
      const map = { new: 'pending', read: 'ready', replied: 'delivered' };
      const labelMap = { new: 'New', read: 'Read', replied: 'Replied' };
      return `<span class="status-badge status-${map[status]}"><span class="status-dot"></span>${labelMap[status]}</span>`;
    }

    /* ── Load messages ── */
    async function loadMessages() {
      try {
        allMessages = await fetch(`${API}/messages`, { headers: authHeaders() }).then(r => r.json());
        updateCounts();
        filterMessages();
      } catch (err) {
        document.getElementById('messagesList').innerHTML =
          '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>Failed to load messages</h3><p>Make sure the server is running.</p></div>';
      }
    }

    function updateCounts() {
      const statuses = ['new', 'read', 'replied'];
      document.getElementById('count-all').textContent = allMessages.length;
      statuses.forEach(s => {
        const el = document.getElementById(`count-${s}`);
        if (el) el.textContent = allMessages.filter(m => m.status === s).length;
      });

      const newCount = allMessages.filter(m => m.status === 'new').length;
      const badge = document.getElementById('msgBadge');
      if (newCount > 0) {
        badge.textContent = newCount;
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }
    }

    function setStatusFilter(status, btn) {
      activeStatus = status;
      document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      filterMessages();
    }

    function filterMessages() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      let filtered = allMessages.filter(m => {
        const matchStatus = !activeStatus || m.status === activeStatus;
        const matchSearch = !search ||
          m.name.toLowerCase().includes(search) ||
          m.phone.includes(search);
        return matchStatus && matchSearch;
      });
      filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      renderMessages(filtered);
    }

    function renderMessages(messages) {
      const list = document.getElementById('messagesList');
      if (messages.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>No messages found</h3>
            <p>Customer messages will appear here.</p>
          </div>`;
        return;
      }

      list.innerHTML = messages.map(m => `
        <div class="msg-card ${m.status === 'new' ? 'unread' : ''}" onclick="openMessageModal('${m._id}')">
          <div class="msg-card-top">
            <div class="msg-card-customer">
              <div class="msg-avatar">${getInitials(m.name)}</div>
              <div>
                <div class="msg-card-name">${m.name}</div>
                <div class="msg-card-phone">${m.phone}</div>
              </div>
            </div>
            <div class="msg-card-date">${formatDate(m.createdAt)}</div>
          </div>
          <div class="msg-card-text">${m.message}</div>
          <div class="msg-card-footer">
            <div style="display:flex;align-items:center;gap:10px">
              ${statusBadgeMsg(m.status)}
              ${m.orderNumber ? `<span class="msg-card-order">Order: ${m.orderNumber}</span>` : ''}
              ${m.replies.length > 0 ? `<span class="msg-card-order">${m.replies.length} repl${m.replies.length > 1 ? 'ies' : 'y'}</span>` : ''}
            </div>
            <div class="msg-card-actions">
              <button class="btn btn-danger btn-sm btn-icon" onclick="event.stopPropagation();openDeleteModal('${m._id}','${m.name.replace(/'/g, "\\'")}')" title="Delete">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
              </button>
            </div>
          </div>
        </div>`).join('');
    }

    /* ── Message detail modal ── */
    async function openMessageModal(id) {
      const m = allMessages.find(m => m._id === id);
      if (!m) return;
      activeMessageId = id;

      document.getElementById('modalCustomerName').textContent = m.name;

      document.getElementById('modalBody').innerHTML = `
        <div class="modal-section-title">Customer</div>
        <div class="detail-row">
          <span class="detail-label">Name</span>
          <span class="detail-val">${m.name}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Phone</span>
          <span class="detail-val">${m.phone}</span>
        </div>
        ${m.email ? `
        <div class="detail-row">
          <span class="detail-label">Email</span>
          <span class="detail-val">${m.email}</span>
        </div>` : ''}
        ${m.orderNumber ? `
        <div class="detail-row">
          <span class="detail-label">Order Number</span>
          <span class="detail-val">${m.orderNumber}</span>
        </div>` : ''}
        <div class="detail-row">
          <span class="detail-label">Received</span>
          <span class="detail-val">${formatDate(m.createdAt)}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Status</span>
          <span class="detail-val">${statusBadgeMsg(m.status)}</span>
        </div>

        <div class="modal-section-title">Message</div>
        <div class="original-message-box">${m.message}</div>

        ${m.replies.length > 0 ? `
          <div class="modal-section-title">Previous Replies</div>
          ${m.replies.map(r => `
            <div class="reply-bubble-admin">
              ${r.text}
              <div class="reply-bubble-admin-meta">${formatDate(r.sentAt)}</div>
            </div>`).join('')}
        ` : ''}

        <div class="modal-section-title">Send a Reply</div>
        <textarea class="reply-textarea" id="replyText" placeholder="Type your reply to ${m.name}..."></textarea>
        <button class="btn btn-primary reply-send-btn" id="sendReplyBtn" onclick="sendReply()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send Reply
        </button>
      `;

      document.getElementById('modalOverlay').classList.add('open');

      // Mark as read if it was new
      if (m.status === 'new') {
        try {
          await fetch(`${API}/messages/${id}/read`, { method: 'PATCH', headers: authHeaders() });
          m.status = 'read';
          updateCounts();
          filterMessages();
        } catch {}
      }
    }

    async function sendReply() {
      const text = document.getElementById('replyText').value.trim();
      if (!text) {
        showToast('Please type a reply before sending', 'error');
        return;
      }

      const btn = document.getElementById('sendReplyBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Sending...';

      try {
        const res = await fetch(`${API}/messages/${activeMessageId}/reply`, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ text }),
        });
        if (!res.ok) throw new Error();

        const updated = await res.json();
        const index = allMessages.findIndex(m => m._id === activeMessageId);
        if (index !== -1) allMessages[index] = updated;

        showToast('Reply sent!', 'success');
        updateCounts();
        filterMessages();
        closeModal();
      } catch {
        showToast('Failed to send reply', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Send Reply`;
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      activeMessageId = null;
    }
    function handleOverlayClick(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    }

    /* ── Delete ── */
    function openDeleteModal(id, name) {
      deleteTargetId = id;
      document.getElementById('deleteCustomerName').textContent = name;
      document.getElementById('deleteOverlay').classList.add('open');
    }
    function closeDeleteModal() {
      document.getElementById('deleteOverlay').classList.remove('open');
      deleteTargetId = null;
    }
    function handleDeleteOverlayClick(e) {
      if (e.target === document.getElementById('deleteOverlay')) closeDeleteModal();
    }
    async function confirmDelete() {
      if (!deleteTargetId) return;
      const btn = document.getElementById('confirmDeleteBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="border-top-color:#dc2626;border-color:#fecaca"></div> Deleting...';

      try {
        const res = await fetch(`${API}/messages/${deleteTargetId}`, {
          method: 'DELETE',
          headers: authHeaders(),
        });
        if (!res.ok) throw new Error();
        showToast('Message deleted', 'success');
        closeDeleteModal();
        await loadMessages();
      } catch {
        showToast('Failed to delete message', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Delete Message';
      }
    }

    requireAuth();
    loadMessages();
  </script>
</body>
</html>
